name: kakaosum 테스트

on:
  push:
    paths:
      - 'kakaosum/**'
      - '.github/workflows/kakaosum-test.yml'
  pull_request:
    paths:
      - 'kakaosum/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kakaosum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 설치
        run: python -m pip install .
      - name: 테스트
        run: python -m unittest discover -s tests -v
